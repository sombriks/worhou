---
name: worhou
services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD:-worhou}
      POSTGRES_USER:  ${DB_USER:-worhou}
      POSTGRES_DB:  ${DB_USER:-worhou}
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
